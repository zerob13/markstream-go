name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MARKSTREAM_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -o artifacts/demo ./examples/demo
      - run: go run ./examples/demo -smoke
      - if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"
  rich:
    runs-on: ubuntu-latest
    env:
      MARKSTREAM_REQUIRE_CHROME: '1'
      MARKSTREAM_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Require installed browser
        run: |
          test -x '${{ steps.chrome.outputs.chrome-path }}'
          echo 'MARKSTREAM_CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}' >> "$GITHUB_ENV"
      - run: go test -race -count=1 ./...
      - run: go run ./examples/demo -page 'Rich content' -snapshot artifacts/gallery.png
      - uses: actions/upload-artifact@v4
        with:
          name: native-rich-gallery
          path: artifacts/gallery.png
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/renderer/package-lock.json
      - run: npm ci --prefix tools/renderer
      - run: npm run build --prefix tools/renderer
      - name: Verify reproducible committed assets
        run: |
          git diff --exit-code -- rich/assets
          test -z "$(git ls-files --others --exclude-standard rich/assets)"
